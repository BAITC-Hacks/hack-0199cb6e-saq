[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ekt-replenishment"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["openpyxl>=3.1", "defusedxml>=0.7"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
